name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYPASS: daybook-personal-key

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download fonts
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf" -o "assets/fonts/Poppins-$w.ttf"
          done
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/greatvibes/GreatVibes-Regular.ttf" -o "assets/fonts/GreatVibes-Regular.ttf"
          curl -fsSL "https://github.com/google/fonts/raw/main/apache/syncopate/Syncopate-Bold.ttf" -o "assets/fonts/Syncopate-Bold.ttf"

      - name: Create Android project files
        run: |
          flutter create --org com.abhi --project-name daybook --platforms=android .
          sed -i 's/android:label="[^"]*"/android:label="Versind"/' android/app/src/main/AndroidManifest.xml

      # App icon: build every launcher size from the Versind logo (android/ is regenerated each build).
      - name: Generate Versind launcher icon
        run: |
          pip install pillow --quiet
          python3 - <<'PY'
          from PIL import Image
          import pathlib
          logo = Image.open('assets/images/versind_logo.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for name, px in sizes.items():
              icon = Image.new('RGBA', (px, px), (0, 0, 0, 255))
              inner = int(px * 0.70)
              lg = logo.resize((inner, inner), Image.LANCZOS)
              icon.alpha_composite(lg, ((px - inner) // 2, (px - inner) // 2))
              d = pathlib.Path(f'android/app/src/main/res/mipmap-{name}')
              d.mkdir(parents=True, exist_ok=True)
              icon.convert('RGB').save(d / 'ic_launcher.png')
          # drop the adaptive-icon xml so the new PNGs are used on every Android version
          for p in pathlib.Path('android/app/src/main/res').glob('mipmap-anydpi*/ic_launcher*.xml'):
              p.unlink()
          PY
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png && echo "launcher icon OK"

      # Habit reminders need native Android setup. Because android/ is regenerated on every
      # build, it is re-applied here each time — and the build FAILS if any part did not apply,
      # so a silently non-working notification build can never be published.
      - name: Prepare Android for reminders
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          app = pathlib.Path('android/app')

          # 1) Manifest: permissions + the receivers that actually show scheduled notifications
          mp = app / 'src/main/AndroidManifest.xml'
          m = mp.read_text()
          perms = """
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
              <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
              <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
          """
          receivers = """
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver"/>
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED"/>
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                          <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                          <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                      </intent-filter>
                  </receiver>
          """
          m = re.sub(r'(<manifest[^>]*>)', lambda x: x.group(1) + perms, m, count=1)
          m = m.replace('</application>', receivers + '    </application>', 1)
          mp.write_text(m)

          # 2) Gradle: core library desugaring (required by the notification plugin)
          kts = app / 'build.gradle.kts'
          groovy = app / 'build.gradle'
          if kts.exists():
              g = kts.read_text()
              g = re.sub(r'(compileOptions\s*\{)', lambda x: x.group(1) + '\n        isCoreLibraryDesugaringEnabled = true', g, count=1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
              if re.search(r'^dependencies\s*\{', g, re.M):
                  g = re.sub(r'(^dependencies\s*\{)', lambda x: x.group(1) + '\n    ' + dep, g, count=1, flags=re.M)
              else:
                  g += '\ndependencies {\n    ' + dep + '\n}\n'
              kts.write_text(g)
          elif groovy.exists():
              g = groovy.read_text()
              g = re.sub(r'(compileOptions\s*\{)', lambda x: x.group(1) + '\n        coreLibraryDesugaringEnabled true', g, count=1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
              if re.search(r'^dependencies\s*\{', g, re.M):
                  g = re.sub(r'(^dependencies\s*\{)', lambda x: x.group(1) + '\n    ' + dep, g, count=1, flags=re.M)
              else:
                  g += '\ndependencies {\n    ' + dep + '\n}\n'
              groovy.write_text(g)
          else:
              sys.exit('No android/app/build.gradle(.kts) found')

          # 3) Keep the launcher icon (used as the notification icon) through resource shrinking
          raw = app / 'src/main/res/raw'
          raw.mkdir(parents=True, exist_ok=True)
          (raw / 'keep.xml').write_text('<?xml version="1.0" encoding="utf-8"?>\n<resources xmlns:tools="http://schemas.android.com/tools" tools:keep="@mipmap/*,@drawable/*" />\n')
          PY

          echo "---- verifying native setup ----"
          grep -q "ScheduledNotificationReceiver" android/app/src/main/AndroidManifest.xml
          grep -q "POST_NOTIFICATIONS" android/app/src/main/AndroidManifest.xml
          grep -q "USE_EXACT_ALARM" android/app/src/main/AndroidManifest.xml
          grep -Eq "isCoreLibraryDesugaringEnabled|coreLibraryDesugaringEnabled" android/app/build.gradle*
          grep -q "desugar_jdk_libs" android/app/build.gradle*
          test -f android/app/src/main/res/raw/keep.xml
          echo "native reminder setup OK"

      - name: Create signing key (first run only)
        run: |
          if [ ! -f signing/release.jks ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.jks -alias daybook \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KEYPASS" -keypass "$KEYPASS" \
              -dname "CN=Daybook, O=Personal, C=IN"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing/release.jks
            git commit -m "Add signing key [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Sign with the stable key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk versind.apk
          $APKSIGNER sign --ks signing/release.jks --ks-key-alias daybook \
            --ks-pass pass:$KEYPASS --key-pass pass:$KEYPASS versind.apk
          $APKSIGNER verify --print-certs versind.apk

      - uses: actions/upload-artifact@v4
        with:
          name: versind-apk
          path: versind.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" versind.apk \
            --repo ${{ github.repository }} \
            --title "Versind build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
