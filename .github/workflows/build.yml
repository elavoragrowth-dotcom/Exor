name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  KEYPASS: daybook-personal-key

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download Poppins font
        run: |
          mkdir -p assets/fonts
          for w in Light Regular Medium SemiBold Bold; do
            curl -fsSL "https://github.com/google/fonts/raw/main/ofl/poppins/Poppins-$w.ttf" -o "assets/fonts/Poppins-$w.ttf"
          done

      - name: Create Android project files
        run: |
          flutter create --org com.abhi --project-name daybook --platforms=android .
          sed -i 's/android:label="[^"]*"/android:label="Daybook"/' android/app/src/main/AndroidManifest.xml

      - name: Create signing key (first run only)
        run: |
          if [ ! -f signing/release.jks ]; then
            mkdir -p signing
            keytool -genkeypair -keystore signing/release.jks -alias daybook \
              -keyalg RSA -keysize 2048 -validity 36500 \
              -storepass "$KEYPASS" -keypass "$KEYPASS" \
              -dname "CN=Daybook, O=Personal, C=IN"
            git config user.name "github-actions"
            git config user.email "actions@users.noreply.github.com"
            git add signing/release.jks
            git commit -m "Add signing key [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Build release APK
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64 --build-number=${{ github.run_number }}

      - name: Sign with the stable key
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          cp build/app/outputs/flutter-apk/app-release.apk daybook.apk
          $APKSIGNER sign --ks signing/release.jks --ks-key-alias daybook \
            --ks-pass pass:$KEYPASS --key-pass pass:$KEYPASS daybook.apk
          $APKSIGNER verify --print-certs daybook.apk

      - uses: actions/upload-artifact@v4
        with:
          name: daybook-apk
          path: daybook.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" daybook.apk \
            --repo ${{ github.repository }} \
            --title "Daybook build ${{ github.run_number }}" \
            --notes "Commit ${{ github.sha }}"
